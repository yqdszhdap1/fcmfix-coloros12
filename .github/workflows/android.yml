name: Android CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Check release notes
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -f "docs/releases/$VERSION_NAME.md" || { echo "::error::missing docs/releases/$VERSION_NAME.md"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          OUT="app/build/outputs/apk/release/fcmfix-coloros-${VERSION_NAME}-op7pro.apk"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            # Stable key from repository secrets: the resulting APK updates over the
            # previous build instead of needing an uninstall (which breaks the LSPosed
            # module path and forces a framework restart to re-register it).
            echo "signing with the repository keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" --key-pass "pass:${KEY_PASSWORD}" \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          else
            # Fallback: an ephemeral key. The APK cannot update an existing install.
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; signing with a throwaway key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname CN=ci
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          fi
          "$BT/apksigner" verify --print-certs "$OUT" | head -5
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcmfix-coloros-${{ env.VERSION_NAME }}-op7pro
          path: app/build/outputs/apk/release/fcmfix-coloros-*-op7pro.apk
          retention-days: 14
