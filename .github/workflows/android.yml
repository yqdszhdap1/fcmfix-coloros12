name: Android CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Check release notes
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -f "docs/releases/$VERSION_NAME.md" || { echo "::error::missing docs/releases/$VERSION_NAME.md"; exit 1; }
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname CN=ci
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android --out "app/build/outputs/apk/release/fcmfix-coloros-13.2.2-op7pro.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcmfix-coloros-13.2.2-op7pro
          path: app/build/outputs/apk/release/fcmfix-coloros-13.2.2-op7pro.apk
          retention-days: 14
